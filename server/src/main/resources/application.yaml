spring:
  application:
    name: buddy-chat-server

buddychat:
  support:
    email: ${SUPPORT_EMAIL:}
    from: ${SUPPORT_FROM:}
    gmail:
      client-id: ${GMAIL_CLIENT_ID:}
      client-secret: ${GMAIL_CLIENT_SECRET:}
      refresh-token: ${GMAIL_REFRESH_TOKEN:}
  firebase:
    # Public project id (also in the app's firebase config). Tokens must be issued for it.
    project-id: ${FIREBASE_PROJECT_ID:buddy-chat-67e35}
  cors:
    # Expo web dev servers. Native apps don't send an Origin, so they are unaffected.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8082,http://localhost:8083}

# Unexpected errors (ERROR logs and uncaught exceptions) go to Sentry when SENTRY_DSN is set. An empty DSN
# leaves the SDK off. What is collected beyond the error itself is turned off in common/ErrorReporting.
sentry:
  dsn: ${SENTRY_DSN:}
  release: ${SENTRY_RELEASE:}
  environment: production
  send-default-pii: false
  max-breadcrumbs: 0
  max-request-body-size: none
  attach-server-name: false
  logging:
    minimum-event-level: error

management:
  health:
    # Mail authorization or provider outages must not take durable report intake offline.
    mail:
      enabled: false
  endpoint:
    health:
      # /actuator/health/liveness is the process alone (no database), for restarting a stuck server.
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health
