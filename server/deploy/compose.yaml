# The server on the Lightsail instance (docs/PROJECT.md, 인프라). Lives in /opt/puny-chat next to
# a .env file with the server's settings (not in Git; see .env.example).
# CI builds and pushes the image; update.sh (a systemd timer) pulls it and recreates the container.

services:
  server:
    image: ghcr.io/ottuck/puny-chat-server:latest
    restart: unless-stopped
    env_file: .env
    # The instance is shared: the JVM heap (-Xmx in .env) plus metaspace and threads must fit.
    mem_limit: 640m
    volumes:
      # Photo files (docs/PROJECT.md, 사진), owned by the image's user (uid 1001); update.sh makes the folder.
      - ./photos:/data/photos
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./public:/srv/public:ro
      - caddy_data:/data
    depends_on:
      - server

  # The daily database dump into ./backups (backup.sh). Its profile keeps `up` from starting it.
  backup:
    image: mongo:8.0
    profiles: [backup]
    env_file: .env
    mem_limit: 256m
    volumes:
      - ./backups:/backups
    command: sh -c 'mongodump --uri="$$SPRING_MONGODB_URI" --db="$$SPRING_MONGODB_DATABASE" --gzip --archive=/backups/dump.archive.gz --quiet'

volumes:
  caddy_data:
