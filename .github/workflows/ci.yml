name: CI

# To save Actions minutes (2,000/month on the free plan) the same code never runs more than twice
# (2026-10-14): once on the work PR into dev, and once on the push to main, which gates the deploy.
# Pushes to dev and dev -> main PRs are skipped as duplicates.
# Changes to docs, Markdown, infra (Terraform) and similar files skip CI; such a push deploys nothing.
# Of the two jobs, only the one whose folder changed runs (see "changes"); anything outside app/ and
# server/ (workflows, root files) runs both.
on:
  pull_request:
    branches: [dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "infra/**"
      - "LICENSE"
      - ".claude/**"
  push:
    branches: [main]
    # LICENSE is not skipped here: the server image carries it, so a LICENSE-only push still has to
    # reach deploy. "changes" skips its tests.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "infra/**"
      - ".claude/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which of app/server needs to run from the changed files (GitHub API, no checkout).
  # On main it compares with the last commit that passed CI there, not the previous push: a run
  # cancelled by the next push (concurrency above) would otherwise leave its changes untested
  # (2026-10-15: a server change was cancelled and the next, app-only push skipped the server).
  # On any error, or when the comparison is unavailable, both run.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      server: ${{ steps.filter.outputs.server }}
    steps:
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.sha }}
        run: |
          app=false; server=false
          if [ "$EVENT" = "pull_request" ]; then
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" -q '.[].filename') || files=
          else
            base=$(gh run list -R "$REPO" --workflow ci.yml --branch main --event push --status success \
              --limit 1 --json headSha -q '.[0].headSha') || base=
            echo "comparing with the last commit that passed: ${base:-none}"
            if [ -n "$base" ]; then
              files=$(gh api "repos/$REPO/compare/$base...$SHA" -q '.files[].filename') || files=
            else
              files=
            fi
          fi
          if [ -z "$files" ]; then
            app=true; server=true
          else
            while IFS= read -r f; do
              case "$f" in
                # The same files paths-ignore skips (plus LICENSE on main, which only redeploys).
                *.md|docs/*|infra/*|LICENSE|.claude/*) ;;
                app/*) app=true ;;
                server/*) server=true ;;
                *) app=true; server=true ;;
              esac
            done <<< "$files"
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "app=$app server=$server"

  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      # Installs the pnpm version pinned in app/package.json "packageManager".
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  server:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Tests use Testcontainers (MongoDB); Docker is available on ubuntu runners.
      - run: ./gradlew spotlessCheck test
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-reports
          path: server/build/reports/tests/test

  # A push to main deploys the server and the web app when no job failed. A job skipped by "changes"
  # does not block it, so the condition must not rely on the default "all needs succeeded".
  deploy:
    needs: [changes, app, server]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/deploy.yml
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # After the server is up, an app change also goes to installed iPhone apps (EAS Update) while the
  # EAS_AUTO_UPDATE repository variable is "true". It is off while a build is in App Review.
  app-update:
    needs: [changes, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' && needs.changes.outputs.app == 'true' && vars.EAS_AUTO_UPDATE == 'true' }}
    uses: ./.github/workflows/app-update.yml
    secrets:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
