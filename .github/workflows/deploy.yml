name: Deploy

# Publishes the server image to GHCR (the Lightsail instance pulls it, see server/deploy) and
# deploys the web app to a Cloudflare Worker (docs/server-design.md, 인프라). Called by CI after it
# passes on a push to main, or run by hand on main.
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Workers deploy). Variables:
# EXPO_PUBLIC_API_URL and the app's public Firebase settings
# EXPO_PUBLIC_FIREBASE_{API_KEY,AUTH_DOMAIN,PROJECT_ID,APP_ID}.
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  server:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A push that changes only the app deploys no server: a new deployment would drop everyone's
      # WebSocket. Run by hand, it always deploys.
      - name: Server changed?
        id: changed
        run: |
          before="${{ github.event.before }}"
          if [ "${{ github.event_name }}" = "push" ] && [ -n "$before" ] && git cat-file -e "$before" 2>/dev/null \
            && git diff --quiet "$before" HEAD -- server; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.deploy == 'true'

      - uses: docker/login-action@v3
        if: steps.changed.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The instance runs update.sh every minute, pulls :latest and recreates the container once the
      # image changed, so there is no inbound SSH from CI. The sha tag is for rolling back by hand.
      - name: Build and push the image
        if: steps.changed.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/puny-chat-server:latest
            ghcr.io/${{ github.repository_owner }}/puny-chat-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Up to five minutes: the timer, the pull, then Spring Boot starting.
      - name: Health check
        if: steps.changed.outputs.deploy == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${{ vars.EXPO_PUBLIC_API_URL }}/actuator/health"; then exit 0; fi
            sleep 5
          done
          echo "health check failed" && exit 1

  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # EXPO_PUBLIC_* values are compiled into the bundle; they are public settings, not secrets.
      - name: Build
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}

      # The Worker, its static assets and its custom domain (app/wrangler.jsonc).
      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
