name: Deploy

# Publishes the server image to GHCR (the Lightsail instance pulls it, see server/deploy) and
# deploys the web app to a Cloudflare Worker (docs/server-design.md, 인프라). Called by CI after it
# passes on a push to main, or run by hand on main.
# Secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Workers deploy). Variables:
# EXPO_PUBLIC_API_URL and the app's public Firebase settings
# EXPO_PUBLIC_FIREBASE_{API_KEY,AUTH_DOMAIN,PROJECT_ID,APP_ID}.
on:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  server:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # A push that changes only the app deploys no server: a new deployment would drop everyone's
      # WebSocket. "Changes" are counted from the release the instance is running (/_revision), not
      # the previous push, so a server change whose deploy was cancelled still goes out with the
      # next push. When that release is unknown, and when run by hand, it always deploys.
      - name: Server changed?
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
        run: |
          running=$(curl -fsS "$API_URL/_revision" || true)
          # Only a commit sha counts; anything else is an unknown release.
          case "$running" in *[!0-9a-f]*) running= ;; esac
          echo "running: ${running:-unknown}"
          if [ "$EVENT" = "push" ] && [ -n "$running" ] && git cat-file -e "$running^{commit}" 2>/dev/null \
            && git diff --quiet "$running" HEAD -- server; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.changed.outputs.deploy == 'true'

      - uses: docker/login-action@v3
        if: steps.changed.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The instance runs update.sh every minute, pulls :latest and recreates the container once the
      # image changed, so there is no inbound SSH from CI. The sha tag is for rolling back by hand.
      - name: Build and push the image
        if: steps.changed.outputs.deploy == 'true'
        uses: docker/build-push-action@v6
        with:
          context: server
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/puny-chat-server:latest
            ghcr.io/${{ github.repository_owner }}/puny-chat-server:${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # update.sh publishes the revision it is running at /_revision once the new container is up.
      # Without this the old container's health would pass the check below.
      - name: Wait for the new release
        if: steps.changed.outputs.deploy == 'true'
        run: |
          for i in $(seq 1 60); do
            if [ "$(curl -fsS "${{ vars.EXPO_PUBLIC_API_URL }}/_revision" || true)" = "${{ github.sha }}" ]; then exit 0; fi
            sleep 5
          done
          echo "the instance did not pick up ${{ github.sha }}" && exit 1

      # Up to five minutes: Spring Boot starting.
      - name: Health check
        if: steps.changed.outputs.deploy == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "${{ vars.EXPO_PUBLIC_API_URL }}/actuator/health"; then exit 0; fi
            sleep 5
          done
          echo "health check failed" && exit 1

  web:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: app/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      # EXPO_PUBLIC_* values are compiled into the bundle; they are public settings, not secrets.
      - name: Build
        run: pnpm build:web
        env:
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
          EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
          EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}

      # The Worker, its static assets and its custom domain (app/wrangler.jsonc).
      - name: Deploy
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
